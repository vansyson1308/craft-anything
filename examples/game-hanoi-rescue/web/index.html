<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#14161a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Lẻn vào phố cổ Hà Nội ban đêm, giải cứu những chú chó bị bọn trộm bắt và thoát ra kịp. Chơi ngay trên trình duyệt, cả điện thoại.">
<title>Giải Cứu Cún: Hà Nội</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  html, body { margin: 0; height: 100%; background: #14161a; overflow: hidden; overscroll-behavior: none; }
  canvas { display: block; position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent; outline: none; }
  /* Read by the game for the notch and home bar. */
  #safe { position: fixed; inset: 0; visibility: hidden; pointer-events: none;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  #boot { position: fixed; inset: 0; display: grid; place-items: center; color: #fbbf24;
    font: 700 20px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 24px; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="safe"></div>
<div id="boot">Đang tải Giải Cứu Cún…</div>
<noscript><p style="color:#fff;text-align:center">Cần bật JavaScript để chơi.</p></noscript>
<script type="module">
  import init from "./hanoi_rescue.js";
  init().catch((e) => {
    const boot = document.getElementById("boot");
    if (boot) boot.textContent = "Không tải được game. Hãy thử trình duyệt mới hơn. (" + e + ")";
  });
</script>
</body>
</html>
