[package]
name = "hanoi-rescue"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "Giải Cứu Cún: Hà Nội, a mobile-first browser game in Rust (WebAssembly + Canvas 2D)."

# Not part of the Craft Anything workspace: a standalone example built on its own.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# The browser front end of the 2D game (canvas, touch, local save). The 3D game uses the core
# without it.
default = ["web"]
web = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Pinned: the wasm-bindgen CLI that builds the page must be this exact version.
wasm-bindgen = "=0.2.130"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "AddEventListenerOptions",
  "CanvasRenderingContext2d",
  "CssStyleDeclaration",
  "Document",
  "Element",
  "Event",
  "EventTarget",
  "HtmlCanvasElement",
  "HtmlElement",
  "ImageData",
  "KeyboardEvent",
  "Performance",
  "PointerEvent",
  "Storage",
  "TextMetrics",
  "VisibilityState",
  "Window",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
# Drawing calls take coordinates, size and colour; grouping them into structs reads worse.
too_many_arguments = "allow"
