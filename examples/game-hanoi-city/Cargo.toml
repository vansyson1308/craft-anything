[package]
name = "hanoi-city"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "Hanoi City: the dog-rescue extraction game in 3D on Hoàn Kiếm's real streets (OpenStreetMap), in Rust (Bevy, WebAssembly)."

# Not part of the Craft Anything workspace: a standalone example built on its own.
[workspace]

[dependencies]
bevy = { version = "0.20", default-features = false, features = ["3d", "ui", "png", "jpeg", "tonemapping_luts"] }
hanoi-rescue = { path = "../game-hanoi-rescue", default-features = false }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Storage", "Location"] }

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1

