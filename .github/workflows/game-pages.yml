# Builds the browser game in examples/game-hanoi-rescue and publishes it on GitHub Pages.
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Game on GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "examples/game-hanoi-rescue/**"
      - ".github/workflows/game-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: game-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/game-hanoi-rescue
    steps:
      - uses: actions/checkout@v4
      - name: Rust for the web
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          rustup default stable
      - name: wasm-bindgen (the version pinned in Cargo.toml)
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - name: Test the game
        run: cargo test --locked
      - name: Build the site
        run: ./build.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: examples/game-hanoi-rescue/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
